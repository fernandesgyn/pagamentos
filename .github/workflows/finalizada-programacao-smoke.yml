name: Finalizada para Programação

on:
  push:
  pull_request:

jobs:
  fluxo-finalizada:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pagamentos
      DB_USERNAME: root
      DB_PASSWORD: root
      MYSQL_PWD: root

    steps:
      - uses: actions/checkout@v4

      - name: Preparar banco e seeds
        run: |
          mysql -h 127.0.0.1 -uroot -e "DROP DATABASE IF EXISTS pagamentos;"
          mysql -h 127.0.0.1 -uroot < database/schema.sql
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/001_cadastros_teste.sql
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/002_fluxo_documentos_inspecoes_teste.sql
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/003_programacao_liquidacao_cmdf_pagamento_teste.sql
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.status_inspecao WHERE nome IN ('Finalizada','Liberada liquidação de imposto') AND permite_avancar=1;" | grep '^2$'

      - name: Subir aplicação
        run: |
          nohup php -d display_errors=1 -d error_reporting=E_ALL -S 127.0.0.1:8080 -t public server.php > /tmp/server.log 2>&1 &
          for tentativa in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/server.log
          exit 1

      - name: Autenticar administrador
        run: |
          curl -fsS -c /tmp/cookies.txt http://127.0.0.1:8080/login > /tmp/login.html
          TOKEN=$(sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' /tmp/login.html | head -n 1)
          test -n "$TOKEN"
          curl -fsS -L -b /tmp/cookies.txt -c /tmp/cookies.txt \
            --data-urlencode "_token=$TOKEN" \
            --data-urlencode "login=admin.teste" \
            --data-urlencode "senha=Teste@123" \
            http://127.0.0.1:8080/login > /tmp/home.html
          grep -q 'Administrador de Teste' /tmp/home.html

      - name: Finalizada deve redirecionar para Programação
        run: |
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:8080/inspecoes/9002 > /tmp/inspecao.html
          TOKEN=$(sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' /tmp/inspecao.html | head -n 1)
          STATUS=$(mysql -h 127.0.0.1 -uroot -N -s -e "SELECT id FROM pagamentos.status_inspecao WHERE nome='Finalizada' AND permite_avancar=1 LIMIT 1;")
          test -n "$TOKEN"
          test -n "$STATUS"

          HTTP=$(curl -sS -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -D /tmp/finalizada.headers -o /tmp/finalizada.body -w '%{http_code}' \
            --data-urlencode "_token=$TOKEN" \
            --data-urlencode "status_id=$STATUS" \
            --data-urlencode "data_conclusao=2026-08-24" \
            --data-urlencode "observacao=Inspeção finalizada e liberada para programação" \
            http://127.0.0.1:8080/inspecoes/9002)
          test "$HTTP" = "302"
          grep -Eiq '^Location: /programacao/9002' /tmp/finalizada.headers

          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.inspecoes i JOIN pagamentos.status_inspecao s ON s.id=i.status_id WHERE i.documento_id=9002 AND s.nome='Finalizada' AND s.permite_avancar=1;" | grep '^1$'

      - name: Finalizada permite criar parcela e avançar para Liquidação
        run: |
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:8080/programacao/9002 > /tmp/programacao.html
          grep -q 'Adicionar parcela 1' /tmp/programacao.html
          TOKEN=$(sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' /tmp/programacao.html | head -n 1)
          TIPO_RECURSO=$(mysql -h 127.0.0.1 -uroot -N -s -e "SELECT id FROM pagamentos.tipos_recurso WHERE codigo='RRT' LIMIT 1;")
          test -n "$TOKEN"

          HTTP=$(curl -sS -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -D /tmp/parcela.headers -o /tmp/parcela.body -w '%{http_code}' \
            --data-urlencode "_token=$TOKEN" \
            --data-urlencode "numero_empenho=2026NEFINAL001" \
            --data-urlencode "natureza_despesa_id=9003" \
            --data-urlencode "exercicio_orcamentario=2026" \
            --data-urlencode "fonte_recurso_id=9001" \
            --data-urlencode "tipo_recurso_id=$TIPO_RECURSO" \
            --data-urlencode "valor_liquido=4500.00" \
            --data-urlencode "tipo=IMPOSTO" \
            --data-urlencode "historico_parcela=Parcela criada após inspeção Finalizada" \
            http://127.0.0.1:8080/programacao/9002/parcelas)
          test "$HTTP" = "302"
          grep -Eiq '^Location: /programacao/9002' /tmp/parcela.headers

          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.parcelas_pagamento WHERE documento_id=9002;" | grep '^1$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.liquidacoes l JOIN pagamentos.parcelas_pagamento p ON p.id=l.parcela_id WHERE p.documento_id=9002 AND l.status='AGUARDANDO';" | grep '^1$'

      - name: Verificar ausência de erros PHP
        if: always()
        run: |
          if grep -Ein 'PHP Warning|PHP Notice|PHP Fatal error|Uncaught|Integrity constraint violation' /tmp/server.log; then
            cat /tmp/server.log
            exit 1
          fi
