name: CI

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Validar PHP
        run: |
          php -v
          php -r "exit(extension_loaded('pdo') && extension_loaded('pdo_mysql') && extension_loaded('mbstring') ? 0 : 1);"
          find app config public scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Garantir arquitetura de produção sem migrations e sem legado
        run: |
          set -euo pipefail
          test -f database/schema.sql
          test ! -d database/migrations
          ! grep -q 'DROP DATABASE' database/schema.sql
          grep -q 'CREATE TABLE origens_recurso' database/schema.sql
          grep -q 'CREATE TABLE cmdf_grupos' database/schema.sql
          grep -q 'CREATE TABLE cmdf_grupo_parcelas' database/schema.sql
          ! grep -q 'CREATE TABLE tipos_recurso' database/schema.sql
          ! grep -q 'CREATE TABLE cmdf_etapas' database/schema.sql
          ! grep -R -nE 'tipos_recurso|tipo_recurso_id|cmdf_etapas|/tipos-recurso|/cmdf/\{parcelaId\}|status_cmdf[^\n]*LIQUIDADA' app config database/seeds docs --exclude='*.md' || exit 1
          test ! -f app/views/paginas/cmdf_form.php
          grep -q "'/origens-recurso'" config/routes.php
          grep -q "'/cmdf/grupos/{grupoId}'" config/routes.php
          grep -q "'cmdf.grupo.ajustar'" database/schema.sql

      - name: Provisionar schema MySQL do zero
        env: {MYSQL_PWD: root}
        run: |
          mysql -h 127.0.0.1 -uroot -e "DROP DATABASE IF EXISTS pagamentos;"
          mysql -h 127.0.0.1 -uroot < database/schema.sql

      - name: Validar schema consolidado
        env: {MYSQL_PWD: root}
        run: |
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='pagamentos';" | grep '^24$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='pagamentos' AND table_name IN ('tipos_recurso','cmdf_etapas');" | grep '^0$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.status_inspecao WHERE permite_avancar=1;" | grep '^2$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.status_inspecao WHERE permite_avancar=1 AND nome IN ('Finalizada','Liberada liquidação de imposto');" | grep '^2$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.permissoes WHERE chave='cmdf.grupo.ajustar';" | grep '^1$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.origens_recurso WHERE codigo IN ('RRT','RDO');" | grep '^2$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='pagamentos' AND table_name='parcelas_pagamento' AND column_name IN ('origem_recurso_id','data_vencimento','ipof','ap_benner','sequencial','grupo_despesa','historico_parcela');" | grep '^7$'

      - name: Carregar e recarregar seeds
        env: {MYSQL_PWD: root}
        run: |
          for rodada in 1 2; do
            mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/001_cadastros_teste.sql
            mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/002_fluxo_documentos_inspecoes_teste.sql
            mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/003_programacao_liquidacao_cmdf_pagamento_teste.sql
          done

      - name: Validar massa e regras CMDF
        env: {MYSQL_PWD: root}
        run: |
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.parcelas_pagamento WHERE id BETWEEN 9000 AND 9999;" | grep '^7$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.parcelas_pagamento WHERE id BETWEEN 9000 AND 9999 AND ipof REGEXP '^[0-9]{10}$' AND ap_benner REGEXP '^[0-9]{10}$' AND sequencial REGEXP '^[0-9]{3}$' AND grupo_despesa REGEXP '^[0-9]{2}$' AND data_vencimento IS NOT NULL AND TRIM(historico_parcela)<>'';" | grep '^7$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.cmdf_grupos WHERE id BETWEEN 9000 AND 9999;" | grep '^3$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT GROUP_CONCAT(status ORDER BY id) FROM pagamentos.cmdf_grupos WHERE id BETWEEN 9000 AND 9999;" | grep '^ATENDIDA,LIBERADA,FECHADA$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.cmdf_grupo_parcelas gp JOIN pagamentos.parcelas_pagamento p ON p.id=gp.parcela_id JOIN pagamentos.documentos_pagamento d ON d.id=p.documento_id WHERE d.data_atesto IS NULL;" | grep '^0$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM (SELECT gp.grupo_id,COUNT(DISTINCT CONCAT(p.fonte_recurso_id,'|',p.exercicio_orcamentario,'|',p.sequencial,'|',p.grupo_despesa,'|',p.origem_recurso_id)) chaves FROM pagamentos.cmdf_grupo_parcelas gp JOIN pagamentos.parcelas_pagamento p ON p.id=gp.parcela_id GROUP BY gp.grupo_id HAVING chaves<>1) x;" | grep '^0$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.pagamentos pg JOIN pagamentos.cmdf_grupo_parcelas gp ON gp.parcela_id=pg.parcela_id JOIN pagamentos.cmdf_grupos g ON g.id=gp.grupo_id WHERE g.status<>'ATENDIDA';" | grep '^0$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.parcelas_pagamento p JOIN pagamentos.liquidacoes l ON l.parcela_id=p.id LEFT JOIN pagamentos.cmdf_grupo_parcelas gp ON gp.parcela_id=p.id WHERE p.id IN (9006,9007) AND l.status='LIQUIDADA' AND gp.parcela_id IS NULL;" | grep '^2$'

      - name: Validar cardinalidade Fornecedor 1 para N Obrigações
        env: {MYSQL_PWD: root}
        run: |
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.obrigacoes o JOIN pagamentos.tipos_obrigacao t ON t.id=o.tipo_obrigacao_id WHERE t.nome='Contrato' AND o.numero='101' AND o.ano=2026;" | grep '^2$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(DISTINCT fornecedor_id) FROM pagamentos.obrigacoes o JOIN pagamentos.tipos_obrigacao t ON t.id=o.tipo_obrigacao_id WHERE t.nome='Contrato' AND o.numero='101' AND o.ano=2026;" | grep '^2$'

      - name: Validar limpeza dos seeds
        env: {MYSQL_PWD: root}
        run: |
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/999_limpar_testes.sql
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.parcelas_pagamento WHERE id BETWEEN 9000 AND 9999;" | grep '^0$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.cmdf_grupos WHERE id BETWEEN 9000 AND 9999;" | grep '^0$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.usuarios WHERE id BETWEEN 9000 AND 9999;" | grep '^0$'
