name: CI

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Versão do PHP
        run: php -v
      - name: Extensões obrigatórias
        run: php -r "exit(extension_loaded('pdo') && extension_loaded('mbstring') ? 0 : 1);"
      - name: Lint PHP
        run: find app config public scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validar schema MySQL
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -uroot < database/schema.sql
      - name: Verificar tabelas centrais
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='pagamentos';" | grep -E '^[1-9][0-9]*$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.status_inspecao WHERE permite_avancar=1;" | grep '^2$'
      - name: Carregar seeds de homologação
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/001_cadastros_teste.sql
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/002_fluxo_documentos_inspecoes_teste.sql
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/003_programacao_liquidacao_cmdf_pagamento_teste.sql
      - name: Validar cenários de homologação
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.usuarios WHERE id BETWEEN 9000 AND 9999;" | grep '^6$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.documentos_pagamento WHERE id BETWEEN 9000 AND 9999;" | grep '^10$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.inspecoes WHERE id BETWEEN 9000 AND 9999;" | grep '^10$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.parcelas_pagamento WHERE id BETWEEN 9000 AND 9999;" | grep '^5$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.pagamentos WHERE id BETWEEN 9000 AND 9999 AND status='PAGO';" | grep '^2$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT ROUND(SUM(valor_total),2) FROM pagamentos.parcelas_pagamento WHERE documento_id=9001;" | grep '^10000.00$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT ROUND(SUM(valor),2) FROM pagamentos.parcela_componentes WHERE parcela_id=9003;" | grep '^10000.00$'
      - name: Validar independência das parcelas
        env:
          MYSQL_PWD: root
        run: |
          # As duas parcelas pertencem à mesma NF 50/documento 9001.
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.parcelas_pagamento WHERE documento_id=9001;" | grep '^2$'
          # Parcela 1 já chegou ao pagamento.
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.parcelas_pagamento p JOIN pagamentos.pagamentos pg ON pg.parcela_id=p.id WHERE p.documento_id=9001 AND p.id=9001 AND pg.status='PAGO';" | grep '^1$'
          # Parcela 2 do mesmo documento continua aguardando liquidação.
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.parcelas_pagamento p JOIN pagamentos.liquidacoes l ON l.parcela_id=p.id WHERE p.documento_id=9001 AND p.id=9002 AND l.status='AGUARDANDO';" | grep '^1$'
          # A parcela 1 não depende da conclusão da parcela 2 para permanecer paga.
          mysql -h 127.0.0.1 -uroot -N -e "SELECT CONCAT(pg.status,'|',l2.status) FROM pagamentos.pagamentos pg JOIN pagamentos.parcelas_pagamento p1 ON p1.id=pg.parcela_id JOIN pagamentos.parcelas_pagamento p2 ON p2.documento_id=p1.documento_id AND p2.id<>p1.id JOIN pagamentos.liquidacoes l2 ON l2.parcela_id=p2.id WHERE p1.id=9001 AND pg.status='PAGO' LIMIT 1;" | grep '^PAGO|AGUARDANDO$'
      - name: Validar limpeza dos seeds
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/999_limpar_testes.sql
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.documentos_pagamento WHERE id BETWEEN 9000 AND 9999;" | grep '^0$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.usuarios WHERE id BETWEEN 9000 AND 9999;" | grep '^0$'