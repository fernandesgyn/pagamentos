name: Runtime Smoke

on:
  push:
  pull_request:

jobs:
  fluxo:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root}
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pagamentos
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - name: Preparar aplicação
        env: {MYSQL_PWD: root}
        run: |
          find app config public scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          test ! -d database/migrations
          mysql -h 127.0.0.1 -uroot -e "DROP DATABASE IF EXISTS pagamentos;"
          mysql -h 127.0.0.1 -uroot < database/schema.sql
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/000_naturezas_despesa_reais.sql
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/001_cadastros_teste.sql
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/002_fluxo_documentos_inspecoes_teste.sql
          mysql -h 127.0.0.1 -uroot pagamentos < database/seeds/003_programacao_liquidacao_cmdf_pagamento_teste.sql
          nohup php -d display_errors=1 -d display_startup_errors=1 -d error_reporting=E_ALL -S 127.0.0.1:8080 -t public server.php >/tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/login >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log; exit 1

      - name: Login administrador
        run: |
          curl -fsS -c /tmp/cookies http://127.0.0.1:8080/login >/tmp/login.html
          TOKEN=$(sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' /tmp/login.html | head -1)
          curl -fsS -L -b /tmp/cookies -c /tmp/cookies --data-urlencode "_token=$TOKEN" --data-urlencode 'login=admin.teste' --data-urlencode 'senha=Teste@123' http://127.0.0.1:8080/login >/tmp/home.html
          grep -q 'Administrador de Teste' /tmp/home.html

      - name: Smoke das rotas principais
        shell: bash
        run: |
          set -euo pipefail
          rotas=(/ /obrigacoes /obrigacoes/nova /documentos /documentos/novo /documentos/9001 /inspecoes /inspecoes/9009 /programacao /programacao/9001 /liquidacoes /liquidacoes/9001 /cmdf /cmdf/grupos/9001 /pagamentos /fornecedores /fontes-recurso /naturezas-despesa /origens-recurso /tipos-documento /tipos-obrigacao /usuarios /perfis)
          padrao='Warning:|Notice:|Fatal error:|Undefined variable|Undefined array key|Uncaught|Deprecated:'
          for rota in "${rotas[@]}"; do
            arq=/tmp/rota$(echo "$rota"|tr '/?' '__').html
            code=$(curl -sS -b /tmp/cookies -o "$arq" -w '%{http_code}' "http://127.0.0.1:8080$rota")
            test "$code" = 200 || { echo "$rota => $code"; cat "$arq"; exit 1; }
            ! grep -Eiq "$padrao" "$arq" || { grep -Ein "$padrao" "$arq"; exit 1; }
          done
          for campo in origem_recurso_id data_vencimento ipof ap_benner sequencial grupo_despesa historico_parcela; do grep -q "name=\"$campo\"" app/views/paginas/programacao_form.php; done
          grep -q 'Origem do Recurso' app/views/paginas/programacao_form.php

      - name: Validar ações e tabelas enxutas
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/obrigacoes >/tmp/acoes-obrigacoes.html
          grep -q '/obrigacoes/9001/excluir' /tmp/acoes-obrigacoes.html
          grep -q 'data-reversao-modal' /tmp/acoes-obrigacoes.html
          ! grep -q '<th>Fontes de recurso</th>' /tmp/acoes-obrigacoes.html
          ! grep -q '<th>Naturezas da despesa</th>' /tmp/acoes-obrigacoes.html

          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/documentos >/tmp/acoes-documentos.html
          grep -q '/documentos/9001/excluir' /tmp/acoes-documentos.html
          ! grep -q '<th>Inspeção</th>' /tmp/acoes-documentos.html

          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/inspecoes >/tmp/acoes-inspecoes.html
          grep -q 'data-reversao-modal' /tmp/acoes-inspecoes.html
          grep -q '>Desfazer<' /tmp/acoes-inspecoes.html
          ! grep -q '<th>Obrigação</th>' /tmp/acoes-inspecoes.html

          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/programacao >/tmp/acoes-programacao.html
          grep -Eq 'Corrigir parcelas|>Desfazer<' /tmp/acoes-programacao.html
          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/programacao/9001 >/tmp/acoes-programacao-parcelas.html
          grep -q 'programacao-parcelas-table' /tmp/acoes-programacao-parcelas.html
          grep -q '>Detalhes<' /tmp/acoes-programacao-parcelas.html
          ! grep -q '<th>Liquidação</th>' /tmp/acoes-programacao-parcelas.html
          ! grep -q 'Abrir CMDF' /tmp/acoes-programacao-parcelas.html
          ! grep -q 'Abrir Liquidação' /tmp/acoes-programacao-parcelas.html

          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/liquidacoes >/tmp/acoes-liquidacoes.html
          grep -q '>Desfazer<' /tmp/acoes-liquidacoes.html
          ! grep -q '<th>CMDF</th>' /tmp/acoes-liquidacoes.html
          ! grep -q '<th>IPOF</th>' /tmp/acoes-liquidacoes.html
          ! grep -q '<th>AP Benner</th>' /tmp/acoes-liquidacoes.html

          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/cmdf >/tmp/acoes-cmdf.html
          grep -q '>Parcelas<' /tmp/acoes-cmdf.html
          grep -q '>Atender<' /tmp/acoes-cmdf.html
          grep -q '>Pagamentos<' /tmp/acoes-cmdf.html
          grep -q '>Desfazer<' /tmp/acoes-cmdf.html
          grep -q '<th>Recursos</th>' /tmp/acoes-cmdf.html
          ! grep -q '<th>Criação</th>' /tmp/acoes-cmdf.html

          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/cmdf/grupos/9001 >/tmp/cmdf-grupo.html
          ! grep -q '<th>Pagamento</th>' /tmp/cmdf-grupo.html

          curl -fsS -b /tmp/cookies 'http://127.0.0.1:8080/pagamentos?cmdf_grupo_id=9001' >/tmp/acoes-pagamentos-grupo.html
          grep -q 'Exibindo pagamentos do grupo CMDF' /tmp/acoes-pagamentos-grupo.html
          grep -q 'Desfazer' /tmp/acoes-pagamentos-grupo.html
          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/pagamentos >/tmp/acoes-pagamentos.html
          grep -q 'id="pagamentoModal"' /tmp/acoes-pagamentos.html
          grep -q 'data-pagamento-modal' /tmp/acoes-pagamentos.html
          ! grep -q '<th>IPOF</th>' /tmp/acoes-pagamentos.html
          ! grep -q '<th>AP Benner</th>' /tmp/acoes-pagamentos.html
          ! grep -q '<th>Grupo CMDF</th>' /tmp/acoes-pagamentos.html

          grep -q 'flex-wrap:wrap!important' public/assets/css/admin-table.css
          ! grep -q 'flex-wrap:nowrap!important' public/assets/css/admin-table.css

      - name: Testar agrupamento CMDF automático, ajuste e status
        shell: bash
        env: {MYSQL_PWD: root}
        run: |
          set -euo pipefail
          csrf(){ curl -fsS -b /tmp/cookies "$1" | sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' | head -1; }

          TOKEN=$(csrf http://127.0.0.1:8080/cmdf/grupos/9003)
          curl -fsS -b /tmp/cookies -c /tmp/cookies -o /dev/null --data-urlencode "_token=$TOKEN" http://127.0.0.1:8080/cmdf/grupos/9003/parcelas/9005/remover
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.cmdf_grupos WHERE id=9003;" | grep '^0$'

          TOKEN=$(csrf http://127.0.0.1:8080/cmdf)
          curl -fsS -b /tmp/cookies -c /tmp/cookies -o /dev/null --data-urlencode "_token=$TOKEN" --data-urlencode 'parcelas_ids[]=9005' --data-urlencode 'parcelas_ids[]=9006' http://127.0.0.1:8080/cmdf/grupos
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.cmdf_grupo_parcelas a JOIN pagamentos.cmdf_grupo_parcelas b ON a.grupo_id=b.grupo_id WHERE a.parcela_id=9005 AND b.parcela_id=9006;" | grep '^0$'

          TOKEN=$(csrf http://127.0.0.1:8080/cmdf)
          curl -fsS -b /tmp/cookies -c /tmp/cookies -o /dev/null --data-urlencode "_token=$TOKEN" http://127.0.0.1:8080/cmdf/grupos/sugerir
          GRUPO=$(mysql -h 127.0.0.1 -uroot -N -s -e "SELECT grupo_id FROM pagamentos.cmdf_grupo_parcelas WHERE parcela_id=9006;")
          test -n "$GRUPO"
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.cmdf_grupo_parcelas WHERE grupo_id=$GRUPO AND parcela_id IN (9006,9007);" | grep '^2$'

          TOKEN=$(csrf http://127.0.0.1:8080/cmdf/grupos/$GRUPO)
          curl -fsS -b /tmp/cookies -c /tmp/cookies -o /dev/null --data-urlencode "_token=$TOKEN" http://127.0.0.1:8080/cmdf/grupos/$GRUPO/parcelas/9007/remover
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.cmdf_grupo_parcelas WHERE grupo_id=$GRUPO;" | grep '^1$'
          TOKEN=$(csrf http://127.0.0.1:8080/cmdf/grupos/$GRUPO)
          curl -fsS -b /tmp/cookies -c /tmp/cookies -o /dev/null --data-urlencode "_token=$TOKEN" --data-urlencode 'parcelas_ids[]=9007' http://127.0.0.1:8080/cmdf/grupos/$GRUPO/parcelas
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.cmdf_grupo_parcelas WHERE grupo_id=$GRUPO;" | grep '^2$'

          TOKEN=$(csrf http://127.0.0.1:8080/cmdf/grupos/$GRUPO)
          curl -fsS -b /tmp/cookies -c /tmp/cookies -o /dev/null --data-urlencode "_token=$TOKEN" --data-urlencode 'status=LIBERADA' http://127.0.0.1:8080/cmdf/grupos/$GRUPO/status
          mysql -h 127.0.0.1 -uroot -N -e "SELECT status FROM pagamentos.cmdf_grupos WHERE id=$GRUPO;" | grep '^LIBERADA$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.pagamentos WHERE parcela_id IN (9006,9007);" | grep '^0$'

          TOKEN=$(csrf http://127.0.0.1:8080/cmdf/grupos/$GRUPO)
          curl -fsS -b /tmp/cookies -c /tmp/cookies -o /dev/null --data-urlencode "_token=$TOKEN" --data-urlencode 'status=ATENDIDA' http://127.0.0.1:8080/cmdf/grupos/$GRUPO/status
          mysql -h 127.0.0.1 -uroot -N -e "SELECT status FROM pagamentos.cmdf_grupos WHERE id=$GRUPO;" | grep '^ATENDIDA$'
          mysql -h 127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM pagamentos.pagamentos WHERE parcela_id IN (9006,9007) AND status='AGUARDANDO';" | grep '^2$'

      - name: Verificar modal de pagamento
        run: |
          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/pagamentos >/tmp/pagamentos.html
          grep -q 'name="valor_liquido_pago"' /tmp/pagamentos.html
          grep -q 'name="historico_pagamento"' /tmp/pagamentos.html
          ! grep -q 'name="benner_ap"' /tmp/pagamentos.html

      - name: Verificar log PHP
        if: always()
        run: |
          cat /tmp/server.log || true
          ! grep -Eiq 'PHP Warning|PHP Notice|PHP Fatal error|Undefined variable|Undefined array key|Uncaught|Deprecated|Integrity constraint violation' /tmp/server.log
